name: Update Biology Paper Website

on:
  schedule:
    # 매일 오전 9시 한국 시간 (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "index.html"
      - "requirements.txt"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bio-paper-digest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:11434/api/tags >/dev/null

      - name: Download AI model
        run: ollama pull qwen2.5:3b

      - name: Collect papers and generate summaries
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: qwen2.5:3b
          MAX_SUMMARIES_PER_RUN: "5"
          MAX_ABSTRACT_REFRESH_PER_RUN: "10"
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Commit updated paper archive
        run: |
          git config user.name "bio-paper-bot"
          git config user.email "bio-paper-bot@users.noreply.github.com"

          git add site/papers.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily paper archive"
            git push origin HEAD:main
          else
            echo "No paper archive changes to commit"
          fi

      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html site/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy website
        uses: actions/deploy-pages@v4
